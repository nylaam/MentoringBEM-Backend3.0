services:
  api:
    image: ghcr.io/nylaam/mentoringbem-backend3.0:latest
    restart: always
    ports:
      - "${APP_PORT:-6767}:${APP_PORT:-6767}"
    env_file:
      - .env
    environment:
      # Di dalam jaringan Docker, host database mengarah ke container 'db'
      - DATABASE_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - POSTGRES_DB=${DATABASE_NAME:-toko_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-toko_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
